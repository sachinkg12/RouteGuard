# LLM-enabled experiment on the IT Service Ticket Classification Dataset.
#
# This config runs both classical and LLM predictors. The LLM section calls
# an OpenAI-compatible endpoint by default; switch `client.kind` to
# `local_transformers` for Phi-3 / Llama-3.2 / Gemma-2.
#
# Before running, set the API key env var referenced below:
#     export OPENAI_API_KEY=...
#
# To keep API cost bounded, the test set is stratified-subsampled down to
# `max_test_samples_for_llm` (default 2000) for LLM scoring. Classical model
# is still evaluated on the full test set.
run_id: llm_sample
output_dir: outputs

dataset:
  dataset_name: it_service_ticket_classification
  dataset_path: data/it_service_tickets.csv
  text_column: Document
  label_column: Topic_group
  minimum_class_count: 10
  max_test_samples_for_llm: 2000
  random_seed: 42

split:
  train_fraction: 0.70
  calibration_fraction: 0.10
  test_fraction: 0.20

classical:
  enabled: true
  name: tfidf_logreg
  max_features: 100000
  ngram_max: 2
  C: 1.0

llm_experiments:
  - name: gpt4o_mini_zero_shot
    enabled: true
    setting: zero_shot
    k_shot_per_class: 0
    self_consistency_samples: 1
    client:
      kind: openai_compatible
      model: gpt-4o-mini
      base_url: null            # null = default OpenAI endpoint
      api_key_env: OPENAI_API_KEY
      temperature: 0.0
      max_tokens: 64
      request_timeout_s: 30
      cost_per_1k_input_tokens: 0.00015
      cost_per_1k_output_tokens: 0.0006
  - name: gpt4o_mini_few_shot_k3
    enabled: true
    setting: few_shot
    k_shot_per_class: 3
    self_consistency_samples: 1
    client:
      kind: openai_compatible
      model: gpt-4o-mini
      base_url: null
      api_key_env: OPENAI_API_KEY
      temperature: 0.0
      max_tokens: 64
      request_timeout_s: 30
      cost_per_1k_input_tokens: 0.00015
      cost_per_1k_output_tokens: 0.0006
  - name: gpt4o_mini_self_consistency_k5
    enabled: false                # turn on if you want SelfConsistencyConfidence
    setting: zero_shot
    k_shot_per_class: 0
    self_consistency_samples: 5
    client:
      kind: openai_compatible
      model: gpt-4o-mini
      api_key_env: OPENAI_API_KEY
      temperature: 0.7
      max_tokens: 64

confidence:
  methods: [model_reported, self_consistency, agreement]

abstention:
  thresholds: [0.50, 0.60, 0.70, 0.80, 0.90]
  agreement_min: 2

cost:
  correct_auto_route: 0.0
  human_triage: 1.0
  wrong_auto_route_options: [2.0, 5.0, 10.0]
  default_wrong_auto_route: 5.0

bootstrap:
  enabled: true
  samples: 1000
  seed: 1337

prompt_template_version: v1
